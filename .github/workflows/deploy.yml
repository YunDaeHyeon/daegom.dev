name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.PEMKEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Validate SSH key format
        run: |
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null && echo "✅ Key format is valid" || echo "❌ Key format is INVALID"

      - name: Sync build to EC2
        run: |
          rsync -avz --delete \
            --exclude node_modules \
            --exclude .git \
            --exclude .github \
            --exclude .agents \
            --exclude .claude \
            --exclude .codex \
            --exclude .impeccable/config.local.json \
            --exclude .impeccable/review \
            --exclude .impeccable/mocks \
            --exclude .impeccable/build \
            --exclude .DS_Store \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/daegom-portfolio/

      - name: Write .env.local on EC2
        run: |
          cat > /tmp/env.local <<'ENVEOF'
          FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL=${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY="${{ secrets.FIREBASE_PRIVATE_KEY }}"
          REVALIDATE_SECRET=${{ secrets.REVALIDATE_SECRET }}
          ENVEOF
          scp -i ~/.ssh/deploy_key /tmp/env.local ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/daegom-portfolio/.env.local
          rm -f /tmp/env.local

      - name: Install prod dependencies & restart on EC2
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            'bash -lic "bash ~/daegom-portfolio/deploy/remote-deploy.sh"'

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key