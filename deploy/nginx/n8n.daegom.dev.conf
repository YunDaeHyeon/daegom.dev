# Reverse proxy for n8n (Docker container). Adjust the port below to match
# whatever host port your docker-compose.yml maps to n8n's container port
# (n8n's own default inside the container is 5678).
#
# Copy to /etc/nginx/sites-available/n8n.daegom.dev.conf, then:
#   sudo ln -s /etc/nginx/sites-available/n8n.daegom.dev.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Run certbot AFTER this is enabled — it edits this file in place to add SSL:
#   sudo certbot --nginx -d n8n.daegom.dev

server {
    listen 80;
    listen [::]:80;
    server_name n8n.daegom.dev;

    location / {
        proxy_pass http://127.0.0.1:5678;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
